<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoAI, Geography and Society — survey results</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #5d6677; --line: #dfe3ea; --accent: #1d5fa8;
  --sd: #c2410c; --md: #f0a064; --ma: #84b9dc; --sa: #1d6fa5;
  --g-academic: #475569; --g-student: #c2377a; --g-parent: #8a8a1f; --g-other: #b8641f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1b212b; --ink: #e8ecf2; --muted: #9aa5b6; --line: #2d3644; --accent: #6aa8ee;
    --sd: #e0663a; --md: #d98a4e; --ma: #5f98c0; --sa: #3d94d0;
    --g-academic: #a3b1c6; --g-student: #ef6fa8; --g-parent: #c8c84a; --g-other: #e0a060;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1b212b; --ink: #e8ecf2; --muted: #9aa5b6; --line: #2d3644; --accent: #6aa8ee;
  --sd: #e0663a; --md: #d98a4e; --ma: #5f98c0; --sa: #3d94d0;
  --g-academic: #a3b1c6; --g-student: #ef6fa8; --g-parent: #c8c84a; --g-other: #e0a060;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; justify-content: space-between; }
h1 { font-size: 24px; margin: 0 0 2px; }
.sub { color: var(--muted); margin: 0; }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--card); }
.pill.demo { color: #b45309; border-color: #b45309; }
.pill.live { color: #15803d; border-color: #15803d; }
.pill.live::before { content: "● "; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }
button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 8px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 18px 0 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.controls .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px; border: 2px solid var(--c); cursor: pointer; user-select: none; background: transparent; }
.chip input { display: none; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip.on { background: var(--c); color: #fff; }
.chip.on .sw { background: #fff; }
.chip.none { border-style: dashed; opacity: .6; }
.chip small { opacity: .85; }
.layout { display: grid; grid-template-columns: 270px 1fr; gap: 16px; align-items: start; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.qlist { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.qlist button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; }
.qlist button:hover { background: var(--bg); }
.qlist button.sel { background: var(--accent); color: #fff; }
.qlist .n { color: var(--muted); font-size: 12px; margin-right: 6px; }
.qlist button.sel .n { color: #dbe8f8; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font-size: 17px; margin: 0 0 4px; }
.card p.note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin: 6px 0 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-family: inherit; }
svg .m { fill: var(--muted); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.row-click { cursor: pointer; }
.row-click:hover rect.hit { fill: var(--bg); }
#cm .cm { border-left: 4px solid var(--c); padding: 6px 12px; margin: 0 0 10px; background: var(--bg); border-radius: 0 8px 8px 0; }
#cm .cm b { display: block; font-size: 12px; color: var(--c); }
#sum .grp { border-left: 4px solid var(--c); padding: 4px 14px 8px; margin: 14px 0; }
#sum .grp h3 { margin: 0 0 4px; font-size: 15px; color: var(--c); }
#sum .body ul { margin: 4px 0 4px 18px; padding: 0; } #sum .body p { margin: 6px 0; }
#sum input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
#sum .err { color: var(--sd); font-size: 13px; }
footer { color: var(--muted); font-size: 13px; margin-top: 8px; }
.help { font-size: 13px; color: var(--muted); }
.help summary { cursor: pointer; }
.help ol { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>GeoAI, Geography and Society</h1>
      <p class="sub">Survey results — how views on AI compare across visitor groups</p>
    </div>
    <div class="status"><span class="pill" id="total"></span></div>
  </header>

  <div class="controls">
    <span class="lbl">Compare</span>
    <span id="chips"></span>
  </div>

  <div class="layout">
    <nav class="qlist" id="qlist" aria-label="Questions"></nav>
    <main id="main"></main>
  </div>
  <footer>Final results. Percentages are of each group’s own responses. Groups with fewer than 10 respondents are shown for completeness but should be read with caution.</footer>
</div>
<script>
// ---------- configuration ----------
const OPTIONS = ['Strongly disagree', 'Mildly disagree', 'Mildly agree', 'Strongly agree'];
const OPT_COL = ['var(--sd)', 'var(--md)', 'var(--ma)', 'var(--sa)'];
const QUESTIONS = [
  { short: 'AI is environmentally destructive', re: /environmentally destructive/i },
  { short: 'AI will increase inequalities', re: /increase social and economic/i },
  { short: 'AI will create jobs and grow the economy', re: /create jobs/i },
  { short: 'AI songs are music; AI pictures are art', re: /songs are music/i },
  { short: 'AI will benefit society', re: /beneficial to society/i },
  { short: 'AI outputs are reliable and trustworthy', re: /reliable and trustworthy/i },
  { short: 'AI is a tool for discovery and innovation', re: /knowledge discovery/i },
  { short: 'There should be a global pause in AI', re: /global pause/i },
  { short: 'I trust AI developers to act ethically', re: /trust the developers/i },
  { short: 'AI is a threat to human civilisation', re: /threat to human civili/i },
  { short: 'Universities should penalise student AI use', re: /penalise students/i },
];

const GROUPS = [
  { id: 'academic', label: 'Academic staff', color: 'var(--g-academic)', on: true },
  { id: 'student', label: 'Prospective students', color: 'var(--g-student)', on: true },
  { id: 'parent', label: 'Parents / guardians', color: 'var(--g-parent)', on: false },
  { id: 'other', label: 'Other visitors', color: 'var(--g-other)', on: false },
];

// ---------- final results (counts only: [strongly disagree, mildly disagree, mildly agree, strongly agree]) ----------
const DATA = {"academic": {"n": 58, "q": [[3, 6, 15, 34], [2, 12, 16, 28], [22, 21, 13, 2], [32, 16, 7, 3], [12, 16, 26, 4], [15, 25, 18, 0], [5, 10, 23, 20], [4, 19, 17, 18], [46, 9, 2, 1], [4, 11, 30, 13], [7, 19, 21, 11]]}, "student": {"n": 19, "q": [[0, 0, 6, 13], [0, 5, 9, 5], [3, 8, 7, 1], [12, 5, 1, 1], [1, 11, 7, 0], [4, 11, 4, 0], [2, 0, 10, 7], [0, 3, 9, 7], [13, 5, 1, 0], [0, 0, 12, 7], [0, 4, 9, 6]]}, "parent": {"n": 9, "q": [[0, 1, 2, 6], [0, 1, 5, 3], [4, 5, 0, 0], [5, 3, 1, 0], [1, 2, 6, 0], [3, 3, 3, 0], [0, 0, 6, 3], [1, 1, 5, 2], [7, 1, 0, 1], [0, 1, 4, 4], [0, 3, 6, 0]]}, "other": {"n": 5, "q": [[0, 0, 3, 2], [0, 0, 3, 2], [2, 1, 2, 0], [3, 1, 1, 0], [0, 1, 4, 0], [1, 1, 3, 0], [0, 0, 3, 2], [2, 1, 1, 1], [5, 0, 0, 0], [0, 1, 3, 1], [0, 2, 3, 0]]}};
// Summaries were written by an AI from the free-text comments. No comments, quotes or comment numbers are included.
const SUMMARIES = {
  academic: {
    total: 13,
    overview: 'Thirteen of the 58 academic staff left a comment. Few saw AI as simply good or bad: most stressed that its effects depend on how it is used, who controls it and how well it is regulated, and many voiced real concern about its costs. A minority were strongly negative.',
    themes: [
      ['It depends on how it is used', 7, 'AI was often described as a tool that can be helpful or useful in the right capacity, with the problem lying in how people use it rather than in its existence.'],
      ['Tech companies’ power and the need for regulation', 7, 'Several worried about the motives and influence of large technology companies and the profit that drives AI’s spread, and some called for regulation or wider oversight.'],
      ['Effects on thinking and skills', 4, 'Some feared that relying on AI weakens critical thinking and the experience of learning, and argued that people still need to think for themselves.'],
      ['Creativity and the value of human work', 4, 'A few argued that AI cannot truly create, and that human labour, craft and creativity should be valued rather than replaced.'],
      ['Environmental and resource costs', 3, 'Some pointed to the strain that large data centres place on natural resources and local communities, while accepting that AI is unlikely to disappear.'],
      ['Doubts about reliability', 2, 'Two comments questioned whether AI outputs can be trusted, citing bias in the material it learns from and the risk of errors.'],
    ],
    divergent: 'Views ranged from seeing AI as a neutral, powerful tool with real opportunities, to strong hostility, including a call to abandon it altogether. One comment stressed that AI, machine learning and large language models are different things, and that much academic machine learning is open and quite unlike commercial chatbots.',
    caveat: 'These comments come from 13 of the 58 academic respondents and were volunteered, so they may over-represent strong feelings.',
  },
};
const MIN_COMMENTS = 8;
const COMMENT_COUNTS = { academic: 13, student: 2, parent: 0, other: 1 };

// ---------- state ----------
let sel = -1;           // -1 = overview, -2 = comments summary

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f0 = x => Math.round(x);
function tally(qi, gid) {
  const c = DATA[gid].q[qi], n = c[0] + c[1] + c[2] + c[3];
  return { c, n, p: c.map(x => n ? 100 * x / n : 0) };
}
// weighted agreement: strong answers (either side) count as two votes; returns % of votes that are for agreeing
const weightedAgree = t => { const v = 2 * t.c[0] + t.c[1] + t.c[2] + 2 * t.c[3]; return v ? 100 * (t.c[2] + 2 * t.c[3]) / v : 0; };
const groupN = gid => DATA[gid].n;
const activeGroups = () => GROUPS.filter(g => g.on && groupN(g.id) > 0);
const smallNote = groups => {
  const s = groups.filter(g => groupN(g.id) < 10).map(g => `${g.label} (n=${groupN(g.id)})`);
  return s.length ? `<p class="note" style="margin-top:10px">Small group${s.length > 1 ? 's' : ''}: ${s.join(', ')} — a few people can move these results a long way, so treat them with caution.</p>` : '';
};

function legendHTML() {
  return '<div class="legend">' + OPTIONS.map((o, i) => `<span><i style="background:${OPT_COL[i]}"></i>${o}</span>`).join('') + '</div>';
}

// Diverging stacked bars: one row per group
function divergingSVG(qi, groups) {
  const data = groups.map(g => ({ g, t: tally(qi, g.id) }));
  const lab = 150, W = 760, rowH = 46, top = 22, H = top + data.length * rowH + 8;
  const ext = Math.max(40, Math.ceil(Math.max(...data.map(d => Math.max(d.t.p[0] + d.t.p[1], d.t.p[2] + d.t.p[3]))) / 20) * 20);
  const cx = lab + (W - lab) / 2, sc = ((W - lab) / 2 - 20) / ext;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of answers by group">`;
  const step = ext > 60 ? 20 : 10;
  for (let v = -Math.floor(ext / step) * step; v <= ext; v += step) {
    const x = cx + v * sc;
    s += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${H - 6}" stroke="var(--line)" ${v === 0 ? 'stroke-width="2"' : ''}/>`;
    s += `<text class="m" x="${x}" y="12" font-size="11" text-anchor="middle">${Math.abs(v)}%</text>`;
  }
  data.forEach((d, i) => {
    const y = top + i * rowH, h = 28;
    s += `<text x="${lab - 10}" y="${y + 14}" font-size="13" text-anchor="end" font-weight="600" fill="${d.g.color}" style="fill:${d.g.color}">${d.g.label}</text>`;
    s += `<text class="m" x="${lab - 10}" y="${y + 29}" font-size="11" text-anchor="end">n=${d.t.n}</text>`;
    if (!d.t.n) { s += `<text class="m" x="${cx}" y="${y + 19}" font-size="12" text-anchor="middle">no responses yet</text>`; return; }
    const seg = (a, b, k) => {
      const w = Math.abs(b - a) * sc; if (w <= 0) return '';
      const x = cx + Math.min(a, b) * sc, p = d.t.p[k];
      const light = k === 1 || k === 2;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${OPT_COL[k]}"><title>${d.g.label} · ${OPTIONS[k]}: ${f0(p)}% (${d.t.c[k]})</title></rect>` +
        (w > 26 ? `<text x="${x + w / 2}" y="${y + 18}" font-size="12" font-weight="600" text-anchor="middle" style="fill:${light ? '#111' : '#fff'}">${f0(p)}%</text>` : '');
    };
    const [p0, p1, p2, p3] = d.t.p;
    s += seg(-p1, 0, 1) + seg(-p1 - p0, -p1, 0) + seg(0, p2, 2) + seg(p2, p2 + p3, 3);
  });
  return s + '</svg>';
}

// Grouped horizontal bars: per option, one bar per group
function groupedSVG(qi, groups) {
  const data = groups.map(g => ({ g, t: tally(qi, g.id) }));
  const lab = 130, W = 760, bh = 16, gap = 3, blockGap = 16;
  const block = data.length * (bh + gap) + blockGap;
  const H = OPTIONS.length * block + 4;
  const mx = Math.max(30, Math.ceil(Math.max(...data.flatMap(d => d.t.p)) / 10) * 10 + 5);
  const sc = (W - lab - 60) / mx;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percentage choosing each answer, by group">`;
  OPTIONS.forEach((o, k) => {
    const y0 = k * block;
    s += `<text x="${lab - 12}" y="${y0 + (data.length * (bh + gap)) / 2 + 4}" font-size="13" text-anchor="end" font-weight="600">${o}</text>`;
    s += `<rect x="${lab - 6}" y="${y0}" width="3" height="${data.length * (bh + gap) - gap}" fill="${OPT_COL[k]}" rx="1"/>`;
    data.forEach((d, i) => {
      const y = y0 + i * (bh + gap), w = d.t.p[k] * sc;
      s += `<rect x="${lab}" y="${y}" width="${Math.max(w, 0)}" height="${bh}" rx="3" fill="${d.g.color}"><title>${d.g.label} · ${o}: ${f0(d.t.p[k])}% (${d.t.c[k]} of ${d.t.n})</title></rect>`;
      s += `<text x="${lab + w + 6}" y="${y + 12}" font-size="12" class="m">${d.t.n ? f0(d.t.p[k]) + '%' : '–'}</text>`;
    });
  });
  return s + '</svg>';
}

// Overview dumbbell: % agree per question, one dot per group
function dumbbellSVG(groups) {
  const lab = 330, W = 960, rowH = 34, top = 30, H = top + QUESTIONS.length * rowH + 6;
  const x = v => lab + v * (W - lab - 40) / 100;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weighted percentage of votes agreeing with each statement, by group">`;
  for (let v = 0; v <= 100; v += 25) {
    s += `<line x1="${x(v)}" x2="${x(v)}" y1="${top - 8}" y2="${H - 6}" stroke="var(--line)" ${v === 50 ? 'stroke-dasharray="4 3" stroke-width="1.5"' : ''}/>`;
    s += `<text class="m" x="${x(v)}" y="14" font-size="11" text-anchor="middle">${v}%</text>`;
  }
  QUESTIONS.forEach((q, qi) => {
    const y = top + qi * rowH + rowH / 2;
    const pts = groups.map(g => { const t = tally(qi, g.id); return { g, t, v: weightedAgree(t) }; }).filter(p => p.t.n);
    s += `<g class="row-click" data-q="${qi}"><rect class="hit" x="0" y="${y - rowH / 2}" width="${W}" height="${rowH}" fill="transparent"/>`;
    s += `<text x="${lab - 14}" y="${y + 4}" font-size="13" text-anchor="end">${qi + 1}. ${q.short}</text>`;
    if (pts.length > 1) {
      const vs = pts.map(p => p.v);
      s += `<line x1="${x(Math.min(...vs))}" x2="${x(Math.max(...vs))}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-width="3" opacity=".45"/>`;
    }
    pts.forEach(p => {
      if (groups.length === 1) s += `<text x="${x(p.v) + 12}" y="${y + 4}" font-size="12" class="m">${f0(p.v)}%</text>`;
      s += `<circle cx="${x(p.v)}" cy="${y}" r="7" fill="${p.g.color}" stroke="var(--card)" stroke-width="2"><title>${p.g.label}: ${f0(p.v)}% of votes agree (n=${p.t.n})</title></circle>`;
    });
    s += '</g>';
  });
  return s + '</svg>';
}

function groupLegend(groups) {
  return '<div class="legend">' + groups.map(g => `<span><i style="background:${g.color};border-radius:50%"></i>${g.label}</span>`).join('') + '</div>';
}



// ---------- summary of comments ----------
function summaryCard(groups) {
  const secs = groups.map(g => {
    const n = COMMENT_COUNTS[g.id], s = SUMMARIES[g.id];
    let body;
    if (s) {
      body = `<p>${esc(s.overview)}</p>` +
        s.themes.map(t => `<div style="margin:10px 0"><strong>${esc(t[0])}</strong> <span class="help">— ${t[1]} of ${s.total} comments</span><br>${esc(t[2])}</div>`).join('') +
        `<p><strong>Differing views:</strong> ${esc(s.divergent)}</p><p class="help">${esc(s.caveat)}</p>`;
    } else {
      body = `<span class="help">${n} comment${n === 1 ? '' : 's'} — too few to summarise (at least ${MIN_COMMENTS} are needed, which also helps keep individual comments anonymous).</span>`;
    }
    return `<div class="grp" style="--c:${g.color}"><h3>${g.label} <small style="font-weight:400;color:var(--muted)">· ${n} comment${n === 1 ? '' : 's'}</small></h3>${body}</div>`;
  }).join('');
  return `<div class="card" id="sum"><h2>What did people write?</h2>
    <p class="note"><strong>AI-generated summary.</strong> Respondents could add free-text comments about AI. These summaries were written by an AI from those comments. They are shown in general terms only: the original comments are not published, and counts are approximate guides to how common each theme was. Because the AI’s wording is its own, treat it as a guide rather than a record of what anyone said.</p>
    ${secs}</div>`;
}

// ---------- rendering ----------
function renderChips() {
  $('chips').innerHTML = '';
  for (const g of GROUPS) {
    const l = document.createElement('label');
    const n = groupN(g.id);
    l.className = 'chip' + (g.on && n ? ' on' : '') + (n ? '' : ' none');
    l.style.setProperty('--c', g.color);
    l.innerHTML = `<input type="checkbox" ${g.on ? 'checked' : ''}><span class="sw"></span>${g.label} <small>${n ? 'n=' + n : 'none'}</small>`;
    l.querySelector('input').onchange = e => { g.on = e.target.checked; render(); };
    $('chips').appendChild(l);
  }
}
function renderQList() {
  const q = $('qlist');
  q.innerHTML = '';
  const mk = (i, text, num) => {
    const b = document.createElement('button');
    b.className = i === sel ? 'sel' : '';
    b.innerHTML = `<span class="n">${num}</span>${text}`;
    b.onclick = () => { sel = i; render(); };
    q.appendChild(b);
  };
  mk(-1, 'Overview — all questions', '◎');
  QUESTIONS.forEach((qq, i) => mk(i, qq.short, i + 1));
  mk(-2, 'What people wrote (AI summary)', '✎');
}
function render() {
  renderChips(); renderQList();
  const groups = activeGroups(), main = $('main');
  $('total').textContent = GROUPS.reduce((n, g) => n + groupN(g.id), 0) + ' responses';
  if (!groups.length) { main.innerHTML = '<div class="card empty">Tick at least one group to compare.</div>'; return; }
  if (sel === -2) {
    main.innerHTML = summaryCard(groups);
  } else if (sel < 0) {
    main.innerHTML = `<div class="card"><h2>Weight of agreement with each statement</h2>
      <p class="note">Each answer is a vote, but strongly agree and strongly disagree count twice. The dot shows the % of a group’s votes that are for agreeing, so right of the dashed line means the weight of opinion in that group is in favour. Click a statement for the full breakdown.</p>
      ${groupLegend(groups)}${dumbbellSVG(groups)}${smallNote(groups)}</div>`;
    main.querySelectorAll('.row-click').forEach(el => el.onclick = () => { sel = +el.dataset.q; render(); });
  } else {
    const q = QUESTIONS[sel];
    main.innerHTML = `<div class="card"><h2>${sel + 1}. ${q.short}</h2>
        <p class="note">Disagreement extends left, agreement right. Hover a segment for counts.</p>
        ${legendHTML()}${divergingSVG(sel, groups)}${smallNote(groups)}</div>
      <div class="card"><h2>Side by side</h2><p class="note">% of each group choosing each answer.</p>
        ${groupLegend(groups)}${groupedSVG(sel, groups)}</div>`;
  }
  window.scrollTo({ top: 0 });
}
render();
</script>
</body>
</html>
